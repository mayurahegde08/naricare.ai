<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #243047; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 8px 4px; background: transparent; }
    .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; }
    button { min-height: 46px; border: 1px solid #d8d4e7; border-radius: 13px; background: #fff; color: #243047; padding: 10px 15px; font-size: 15px; font-weight: 650; cursor: pointer; }
    button:focus-visible { outline: 3px solid #b8a8f0; outline-offset: 3px; }
    button.primary { color: #fff; background: #6750a4; border-color: #6750a4; }
    button:disabled { opacity: .58; cursor: not-allowed; }
    .status { width: 100%; min-height: 24px; color: #566277; font-size: 13px; line-height: 1.45; }
    .status[role="alert"] { color: #b42318; }
    .rec { width: 100%; display: flex; flex-wrap: wrap; gap: 8px; }
    .play { display: flex; gap: 8px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="wrap" id="root"></div>
  <script>
    (() => {
      const root = document.getElementById("root");
      let args = { lang: "en-IN", language_name: "English", voice_text: "", show_recorder: false, reset_token: "" };
      let recognition = null;
      let lastToken = "";

      function send(type, data = {}) {
        window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
      }
      function setValue(value) { send("streamlit:setComponentValue", { value }); }
      function setHeight() { send("streamlit:setFrameHeight", { height: Math.max(document.body.scrollHeight, 36) }); }
      function status(text, alert = false) {
        const node = root.querySelector(".status");
        if (!node) return;
        node.textContent = text;
        node.setAttribute("role", alert ? "alert" : "status");
      }
      function button(text, handler, primary = false) {
        const node = document.createElement("button");
        node.type = "button";
        node.textContent = text;
        if (primary) node.className = "primary";
        node.addEventListener("click", handler);
        return node;
      }
      function stopRecognition() {
        if (recognition) {
          try { recognition.stop(); } catch (_) { /* It may already be stopped. */ }
        }
      }
      function startRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          status("Speech recognition is not available in this browser. Type your symptoms instead.", true);
          return;
        }
        try {
          recognition = new SpeechRecognition();
          recognition.lang = args.lang || "en-IN";
          recognition.continuous = false;
          recognition.interimResults = false;
          recognition.maxAlternatives = 1;
          let finished = false;
          recognition.onstart = () => status(`Listening in ${args.language_name}. Speak clearly, then wait for the transcript.`);
          recognition.onresult = (event) => {
            let transcript = "";
            for (let i = event.resultIndex; i < event.results.length; i++) transcript += event.results[i][0].transcript;
            transcript = transcript.trim();
            if (!transcript) {
              status("No words were captured. Try again or type your symptoms.", true);
              return;
            }
            finished = true;
            status("Transcript added to the editable text box. Please review it before continuing.");
            setValue({ type: "transcript", text: transcript, eventId: `${Date.now()}-${Math.random().toString(16).slice(2)}` });
          };
          recognition.onerror = (event) => {
            const messages = {
              "not-allowed": "Microphone permission was denied. Allow microphone access in your browser settings or type your symptoms.",
              "service-not-allowed": "This browser or device blocked speech recognition. Type your symptoms instead.",
              "audio-capture": "No microphone was found. Connect a microphone or type your symptoms.",
              "no-speech": "No speech was detected. Try again in a quieter place or type your symptoms.",
              "network": "The browser speech service could not connect. Check your connection or type your symptoms.",
              "language-not-supported": `This browser speech service does not support ${args.language_name}. Choose another language or type your symptoms.`,
            };
            status(messages[event.error] || "Speech recognition failed. Try again or type your symptoms.", true);
          };
          recognition.onend = () => {
            if (!finished && root.querySelector(".status")?.textContent.startsWith("Listening")) status("Recording stopped. If no transcript appeared, try again or type your symptoms.");
          };
          recognition.start();
        } catch (error) {
          status("The microphone could not start. Check browser permissions or type your symptoms.", true);
        }
      }
      function speak(replay = false) {
        if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) {
          status("Spoken responses are not available in this browser. The written response is still available.", true);
          return;
        }
        const voices = window.speechSynthesis.getVoices();
        const prefix = (args.lang || "en").toLowerCase().split("-")[0];
        const voice = voices.find((item) => (item.lang || "").toLowerCase().split("-")[0] === prefix);
        if (!voice) {
          status(`This browser does not currently offer a ${args.language_name} speech voice. The written response is still available.`, true);
          return;
        }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(args.voice_text || "");
        utterance.lang = args.lang || voice.lang;
        utterance.voice = voice;
        utterance.rate = 0.96;
        utterance.onstart = () => status(replay ? "Replaying the written response aloud." : "Reading the written response aloud.");
        utterance.onend = () => status("Finished. Use Replay to hear the response again.");
        utterance.onerror = () => status("Speech playback stopped. The written response is still available.", true);
        window.speechSynthesis.speak(utterance);
      }
      function render() {
        root.replaceChildren();
        if (args.show_recorder) {
          const rec = document.createElement("div");
          rec.className = "rec";
          rec.append(
            button("🎙️ Start recording", startRecognition, true),
            button("Try again", startRecognition),
            button("Stop", stopRecognition),
            button("Cancel", () => { stopRecognition(); status("Recording cancelled. The typed-input option is available."); })
          );
          root.append(rec);
        }
        if (args.voice_text) {
          const play = document.createElement("div");
          play.className = "play";
          play.append(
            button("🔊 Listen to response", () => speak(false), true),
            button("Stop speaking", () => { if ("speechSynthesis" in window) window.speechSynthesis.cancel(); status("Speech stopped. The written response remains visible."); }),
            button("Replay", () => speak(true))
          );
          root.append(play);
        }
        const msg = document.createElement("div");
        msg.className = "status";
        msg.setAttribute("role", "status");
        msg.textContent = args.show_recorder ? `Selected recognition language: ${args.language_name}. Browser and network support varies.` : "";
        root.append(msg);
        setHeight();
      }

      window.addEventListener("message", (event) => {
        const data = event.data;
        if (!data || data.type !== "streamlit:render") return;
        args = { ...args, ...(data.args || {}) };
        if (args.reset_token !== lastToken) {
          lastToken = args.reset_token;
          if ("speechSynthesis" in window) window.speechSynthesis.cancel();
        }
        render();
      });
      send("streamlit:componentReady", { apiVersion: 1 });
      setHeight();
    })();
  </script>
</body>
</html>
